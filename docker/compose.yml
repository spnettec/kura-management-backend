# Default deployment: open the setup page and select PostgreSQL there.
# No database password, TLS bind mount or application credential is required.
services:
  console:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: yofc-management-console:latest
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - console-data:/var/lib/kura-management-console
    restart: unless-stopped

volumes:
  console-data:
