spring:
  datasource:
    url: jdbc:h2:mem:kura_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

mqtt:
  broker-uri: tcp://127.0.0.1:1883
  username: backend
  password: backend-secret
